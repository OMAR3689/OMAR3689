name: Transport Lead Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      MAX_EMAILS_PER_RUN: '5'
      PRESENTATION_URL: 'https://trmb.ma/'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier les clés et la configuration
        run: |
          test -n "$TAVILY_API_KEY" || { echo "❌ TAVILY_API_KEY manquante"; exit 1; }
          echo "✅ TAVILY_API_KEY détectée"
          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ]; then
            echo "✅ SMTP détecté — envoi automatique activé"
          else
            echo "⚠️ SMTP incomplet — aucun email ne sera envoyé"
          fi

      - name: Discover leads and outreach
        run: python transport-lead-agent/agent.py

      - name: Commit lead files
        run: |
          git config user.name 'AI Transport Lead Agent'
          git config user.email 'actions@github.com'
          git add transport-lead-agent/data/leads.json transport-lead-agent/data/leads.csv transport-lead-agent/data/contacted.json
          git diff --cached --quiet || git commit -m 'Update transport leads and outreach log'
          git push
