name: Transport Lead Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'transport-lead-agent/agent.py'
      - '.github/workflows/transport-leads.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: transport-lead-agent
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT || '993' }}
      IMAP_SENT_FOLDER: ${{ secrets.IMAP_SENT_FOLDER }}
      MAX_EMAILS_PER_RUN: '50'
      MAX_EMAILS_PER_HOUR: '100'
      PRESENTATION_URL: 'https://trmb.ma/'
      PRESENTATION_PDF_URL: 'https://trmb.ma/assets/documents/presentation-trmb-services.pdf?v=20261018'
      PRESENTATION_PDF_FILENAME: 'Presentation_TRMB_SERVICES_2026.pdf'
      SMTP_RETRIES: '3'

    steps:
      - uses: actions/checkout@v5

      - name: Record automation cycle start
        run: echo "TRMB_RUN_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Vérifier la configuration
        run: |
          echo "✅ Recherche web gratuite activée — aucun crédit Tavily requis"
          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ]; then
            echo "✅ SMTP détecté — envoi automatique activé"
          else
            echo "⚠️ SMTP incomplet — aucun email ne sera envoyé"
          fi

      - name: Installer le moteur de recherche gratuit
        run: python -m pip install --disable-pip-version-check --no-warn-script-location ddgs

      - name: Discover leads and outreach
        run: python transport-lead-agent/agent.py

      - name: Commit lead files
        run: |
          git config user.name 'AI Transport Lead Agent'
          git config user.email 'actions@github.com'
          git add transport-lead-agent/data/leads.json transport-lead-agent/data/leads.csv transport-lead-agent/data/contacted.json
          git diff --cached --quiet || git commit -m 'Update transport leads and outreach log'
          git pull --rebase origin main
          git push

      # Keep the automation alive without relying on GitHub's delayed schedule event.
      # Each successful cycle dispatches the next one at least 5 minutes after its start.
      - name: Schedule next five-minute cycle
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - TRMB_RUN_START_EPOCH ))
          if [ "$elapsed" -lt 300 ]; then
            delay=$((300 - elapsed))
            echo "Waiting $delay seconds to maintain a five-minute minimum interval."
            sleep "$delay"
          fi
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/transport-leads.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "✅ Next automatic cycle dispatched."
