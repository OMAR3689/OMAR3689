name: TRMB Lead Agent V2 - Isolated CI Tests

on:
  push:
    branches: [trmb-agent-v2]
    paths:
      - 'transport-lead-agent-v2/agent.py'
      - 'transport-lead-agent-v2/sources.py'
      - 'transport-lead-agent-v2/test_*.py'
      - '.github/workflows/trmb-v2-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trmb-v2-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: trmb-agent-v2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-warn-script-location ddgs pypdf

      - name: Validate syntax
        run: |
          python -m py_compile transport-lead-agent-v2/agent.py transport-lead-agent-v2/sources.py transport-lead-agent-v2/test_agent.py transport-lead-agent-v2/test_sources.py

      - name: Run isolated unit tests
        run: python -m unittest discover -s transport-lead-agent-v2 -p 'test_*.py' -v
