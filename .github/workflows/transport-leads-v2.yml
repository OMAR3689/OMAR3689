# V2 discovery, official-contact verification, persistent history, and bounded retries.
name: TRMB Lead Agent V2 - Verified Outreach
# Intentional [send-v2] commits run the guarded send mode only after the Python tests pass.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview only or send to verified official business contacts"
        type: choice
        options:
          - preview
          - send
        default: preview
        required: true
  push:
    branches: [trmb-agent-v2]
    paths:
      - 'transport-lead-agent-v2/agent.py'
      - 'transport-lead-agent-v2/sources.py'
      - 'transport-lead-agent-v2/test_sources.py'
      - 'transport-lead-agent-v2/test_agent.py'
      - '.github/workflows/transport-leads-v2.yml'

permissions:
  contents: write
  actions: write

concurrency:
  # Keep real send cycles separate from disposable previews. A newer preview can
  # replace an older preview, but it cannot cancel an active outreach cycle.
  group: trmb-agent-v2-${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'send') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[send-v2]')) ) && 'send' || 'preview' }}
  cancel-in-progress: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[send-v2]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'send') }}

jobs:
  preview:
    # Code pushes are checked by the isolated CI workflow; only manual preview/send
    # dispatches and an intentional [send-v2] activation run the discovery pipeline.
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[send-v2]'))) && github.ref == 'refs/heads/trmb-agent-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # One intentional activation push is tagged [send-v2]. Later code pushes
      # default back to preview; manual workflow runs can explicitly choose send.
      DRY_RUN: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[send-v2]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'send') }}
      MAX_EMAILS_PER_RUN: '10'
      MAX_EMAILS_PER_HOUR: '20'
      MIN_SENDABLE_LEADS: '1'
      MIN_PREVIEW_LEADS: '5'
      MIN_LEAD_SCORE: '60'
      PRESENTATION_URL: 'https://trmb.ma/'
      PRESENTATION_PDF_URL: 'https://trmb.ma/assets/documents/presentation-trmb-services.pdf?v=20261018'
      PRESENTATION_PDF_FILENAME: 'Presentation_TRMB_SERVICES_2026.pdf'
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT || '993' }}
      IMAP_SENT_FOLDER: ${{ secrets.IMAP_SENT_FOLDER }}
      SMTP_RETRIES: '3'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: trmb-agent-v2

      - name: Verify isolated V2 and load outreach suppression history
        run: |
          echo "DRY_RUN=$DRY_RUN"
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:transport-lead-agent/data/contacted.json > "$RUNNER_TEMP/v1-contacted.json"
          echo "V1_HISTORY_FILE=$RUNNER_TEMP/v1-contacted.json" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install free search engine
        run: python -m pip install --disable-pip-version-check --no-warn-script-location ddgs pypdf

      - name: Validate Python syntax and unit tests
        run: |
          python -m py_compile transport-lead-agent-v2/agent.py transport-lead-agent-v2/sources.py transport-lead-agent-v2/test_sources.py transport-lead-agent-v2/test_agent.py
          python -m unittest discover -s transport-lead-agent-v2 -p 'test_*.py' -v

      - name: Discover qualified contacts and execute configured mode
        id: discover
        run: python transport-lead-agent-v2/agent.py

      # Persist sent_at / suppression history before any post-run validation can fail.
      - name: Commit V2 lead, tender and outreach history
        if: always()
        run: |
          git config user.name 'TRMB Lead Agent V2'
          git config user.email 'actions@github.com'
          git add transport-lead-agent-v2/data/leads.json transport-lead-agent-v2/data/leads.csv transport-lead-agent-v2/data/contacted.json transport-lead-agent-v2/data/tenders.json transport-lead-agent-v2/data/tenders.csv
          if git diff --cached --quiet; then
            echo "ℹ️ No V2 data changes to commit."
          else
            git commit -m 'Store V2 discovery and outreach state'
            git fetch origin trmb-agent-v2
            git rebase refs/remotes/origin/trmb-agent-v2
            git push origin HEAD:trmb-agent-v2
          fi

      - name: Validate saved results and email outcomes
        if: always()
        env:
          DISCOVERY_RESULT: ${{ steps.discover.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from urllib.parse import urlparse

          sys.path.insert(0, str(Path("transport-lead-agent-v2").resolve()))
          import sources

          if os.environ.get("DISCOVERY_RESULT") != "success":
              raise SystemExit(
                  "Validation blocked: discovery/send step did not complete successfully "
                  f"(outcome={os.environ.get('DISCOVERY_RESULT', 'missing')})."
              )

          out = Path("transport-lead-agent-v2/data")
          leads = json.loads((out / "leads.json").read_text(encoding="utf-8"))
          tenders = json.loads((out / "tenders.json").read_text(encoding="utf-8"))
          run_id = os.environ.get("GITHUB_RUN_ID", "").strip()
          run_leads = [x for x in leads if str(x.get("run_id", "")) == run_id] if run_id else leads
          dry_run = os.environ.get("DRY_RUN", "true").strip().lower() in {"1", "true", "yes", "on"}
          minimum = max(1, int(os.environ.get("MIN_SENDABLE_LEADS", "1")))
          preview_minimum = max(1, int(os.environ.get("MIN_PREVIEW_LEADS", "5")))
          minimum_score = max(60, int(os.environ.get("MIN_LEAD_SCORE", "60")))
          expected_status = "dry_run_preview" if dry_run else "sent"
          outcomes = [x for x in run_leads if x.get("status") == expected_status]

          if not dry_run:
              smtp_errors = [x for x in run_leads if x.get("status") == "smtp_error"]
              if smtp_errors:
                  details = "; ".join(f"{x.get('company')}: {x.get('smtp_error', 'unknown SMTP error')}" for x in smtp_errors[:5])
                  raise SystemExit(f"Validation failed: {len(smtp_errors)} SMTP failure(s): {details}")
              if not outcomes:
                  print("ℹ️ Send cycle succeeded: no new verified contacts; no emails sent.")
              elif len(outcomes) < minimum:
                  raise SystemExit(
                      f"Validation failed: {len(outcomes)} verified {expected_status} records; "
                      f"at least {minimum} required."
                  )
          elif len(outcomes) < preview_minimum:
              print(
                  f"ℹ️ Preview-only cycle: {len(outcomes)} verified contact(s); "
                  f"{preview_minimum} preferred for a larger preview. No email can be sent in preview mode."
              )

          emails = [str(x.get("email", "")).strip().lower() for x in outcomes]
          if any(not email for email in emails) or len(emails) != len(set(emails)):
              raise SystemExit("Validation failed: missing or duplicate email addresses in outcomes.")

          for lead in outcomes:
              source = str(lead.get("email_source_url", "")).strip()
              source_host = (urlparse(source).hostname or "").lower().removeprefix("www.")
              company_host = (urlparse(str(lead.get("url", ""))).hostname or "").lower().removeprefix("www.")
              email = str(lead.get("email", "")).strip().lower()
              if (
                  urlparse(source).scheme != "https"
                  or not source_host
                  or source_host != company_host
                  or lead.get("email_verified") is not True
                  or not sources.is_public_business_email(
                      email, site_domain=company_host, allow_external_domain=True
                  )
                  or int(lead.get("score", 0) or 0) < minimum_score
              ):
                  raise SystemExit(
                      f"Validation failed: unverified official contact in outcomes for {lead.get('company')}."
                  )

          for tender in tenders:
              host = (urlparse(str(tender.get("url", ""))).hostname or "").lower().removeprefix("www.")
              if host != "marchespublics.gov.ma":
                  raise SystemExit("Validation failed: a tender record does not point to the official procurement portal.")

          mode = "preview" if dry_run else "send"
          recipient_rejections = sum(1 for x in run_leads if x.get("status") == "smtp_rejected")
          temporary_retries = sum(1 for x in run_leads if x.get("status") in {"smtp_retry_pending", "smtp_retry_wait"})
          infrastructure_errors = sum(1 for x in run_leads if x.get("status") == "smtp_error")
          print(
              f"✅ Validation passed: mode={mode}; {len(outcomes)} verified official-domain "
              f"business contact(s) recorded as {expected_status}; {infrastructure_errors} SMTP/service error(s); "
              f"{recipient_rejections} permanently rejected recipient(s) suppressed; "
              f"{temporary_retries} temporary rejection(s) deferred for retry."
          )
          print(f"📑 Active official public-tender notices saved in the archive: {len(tenders)}.")
          PY

      - name: Queue the next verified V2 cycle
        if: ${{ success() && env.DRY_RUN == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "⏳ Check whether a verified V2 cycle is already queued before dispatching another."
          sleep 90
          RUNS_JSON="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/runs?branch=trmb-agent-v2&per_page=100")"

          # One active dispatch owns the chain: the oldest active run queues the next
          # cycle unless another send run is already queued. Newer active runs yield.
          QUEUED="$(printf '%s' "$RUNS_JSON" | jq --arg this "$GITHUB_RUN_ID" '
            [.workflow_runs[]?
             | select((.id | tostring) != $this)
             | select(.path == ".github/workflows/transport-leads-v2.yml")
             | select(.event == "workflow_dispatch")
             | select(.status == "queued" or .status == "pending")]
            | length
          ')"
          if [[ "$QUEUED" -gt 0 ]]; then
            echo "ℹ️ $QUEUED next-cycle dispatch(es) already queued; not adding another."
            exit 0
          fi

          OLDER_ACTIVE="$(printf '%s' "$RUNS_JSON" | jq --arg this "$GITHUB_RUN_ID" '
            [.workflow_runs[]?
             | select((.id | tostring) != $this)
             | select(.path == ".github/workflows/transport-leads-v2.yml")
             | select(.event == "workflow_dispatch")
             | select(.status == "in_progress")
             | select((.id | tonumber) < ($this | tonumber))]
            | length
          ')"
          if [[ "$OLDER_ACTIVE" -gt 0 ]]; then
            echo "ℹ️ An older V2 dispatch is still active; it owns the next-cycle queue."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"trmb-agent-v2","inputs":{"mode":"send"}}' \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/transport-leads-v2.yml/dispatches"
          echo "✅ Next verified V2 cycle queued."
