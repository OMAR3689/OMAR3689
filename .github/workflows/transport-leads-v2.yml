name: TRMB Lead Agent V2 - Manual Dry Run

on:
  workflow_dispatch:
  push:
    branches: [trmb-agent-v2]
    paths:
      - 'transport-lead-agent-v2/agent.py'
      - 'transport-lead-agent-v2/sources.py'
      - 'transport-lead-agent-v2/test_sources.py'
      - 'transport-lead-agent-v2/test_agent.py'
      - '.github/workflows/transport-leads-v2.yml'

permissions:
  contents: write

concurrency:
  group: trmb-agent-v2
  cancel-in-progress: true

jobs:
  preview:
    if: github.ref == 'refs/heads/trmb-agent-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: 'true'
      MAX_EMAILS_PER_RUN: '10'
      MAX_EMAILS_PER_HOUR: '20'
      PRESENTATION_URL: 'https://trmb.ma/'
      PRESENTATION_PDF_URL: 'https://trmb.ma/assets/documents/presentation-trmb-services.pdf?v=20261018'
      PRESENTATION_PDF_FILENAME: 'Presentation_TRMB_SERVICES_2026.pdf'
    steps:
      - uses: actions/checkout@v5

      - name: Verify isolated V2 and live V1 history
        run: |
          echo "✅ V2 manual preview mode — no emails are sent."
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:transport-lead-agent/data/contacted.json > "$RUNNER_TEMP/v1-contacted.json"
          echo "V1_HISTORY_FILE=$RUNNER_TEMP/v1-contacted.json" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install free search engine
        run: python -m pip install --disable-pip-version-check --no-warn-script-location ddgs

      - name: Validate Python syntax
        run: |
          python -m py_compile transport-lead-agent-v2/agent.py transport-lead-agent-v2/sources.py transport-lead-agent-v2/test_sources.py transport-lead-agent-v2/test_agent.py
          python -m unittest discover -s transport-lead-agent-v2 -p 'test_*.py' -v

      - name: Discover and preview prospects (no sending)
        run: python transport-lead-agent-v2/agent.py

      - name: Validate saved V2 preview results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          out = Path("transport-lead-agent-v2/data")
          leads = json.loads((out / "leads.json").read_text(encoding="utf-8"))
          tenders = json.loads((out / "tenders.json").read_text(encoding="utf-8"))
          previews = [x for x in leads if x.get("status") == "dry_run_preview"]

          if len(previews) < 7:
              raise SystemExit(f"Validation failed: only {len(previews)} qualified email previews; expected at least 7.")
          emails = [str(x.get("email", "")).strip().lower() for x in previews]
          if len(emails) != len(set(emails)):
              raise SystemExit("Validation failed: duplicate email addresses in preview.")
          for lead in previews:
              source = str(lead.get("email_source_url", "")).strip()
              source_host = (urlparse(source).hostname or "").lower().removeprefix("www.")
              company_host = str(lead.get("domain", "")).strip().lower().removeprefix("www.")
              if urlparse(source).scheme != "https" or not source_host or source_host != company_host:
                  raise SystemExit(f"Validation failed: official source URL missing or domain mismatch for {lead.get('company')}.")
          for tender in tenders:
              host = (urlparse(str(tender.get("url", ""))).hostname or "").lower().removeprefix("www.")
              if host != "marchespublics.gov.ma":
                  raise SystemExit("Validation failed: a tender record does not point to the official public-procurement portal.")

          print(f"✅ Preview validation passed: {len(previews)} unique emails, each with an HTTPS official-domain source.")
          print(f"ℹ️ Public tender candidates: {len(tenders)} (stored separately, never emailed automatically).")
          PY

      - name: Commit V2 preview data only
        run: |
          git config user.name 'TRMB Lead Agent V2'
          git config user.email 'actions@github.com'
          git add transport-lead-agent-v2/data/leads.json transport-lead-agent-v2/data/leads.csv transport-lead-agent-v2/data/contacted.json transport-lead-agent-v2/data/tenders.json transport-lead-agent-v2/data/tenders.csv
          git diff --cached --quiet || git commit -m 'Update TRMB Lead Agent V2 preview data'
          git push origin HEAD:trmb-agent-v2
