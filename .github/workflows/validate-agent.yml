name: Validate Transport Lead Agent

on:
  push:
    branches: [main]
    paths:
      - 'transport-lead-agent/agent.py'
      - '.github/workflows/validate-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile transport-lead-agent/agent.py

      - name: Verify official presentation PDF is downloadable
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen

          url = "https://trmb.ma/assets/documents/presentation-trmb-services.pdf?v=20261018"
          req = Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (compatible; TRMB-Services-PDF-Check/1.0)",
                  "Accept": "application/pdf,*/*;q=0.8",
              },
          )
          with urlopen(req, timeout=25) as response:
              data = response.read(10 * 1024 * 1024 + 1)
              content_type = response.headers.get("Content-Type", "")
              status = response.status
          assert status == 200, f"Unexpected HTTP status: {status}"
          assert len(data) <= 10 * 1024 * 1024, "PDF is larger than the 10 MB limit"
          assert data.startswith(b"%PDF-"), f"Response is not a PDF: {content_type}"
          print(f"✅ Official presentation PDF is reachable ({len(data)} bytes, {content_type}).")
          PY

      - name: Smoke-test safety helpers (no emails sent)
        run: |
          python - <<'PY'
          import importlib.util
          from datetime import datetime, timedelta, timezone

          spec = importlib.util.spec_from_file_location(
              "transport_agent", "transport-lead-agent/agent.py"
          )
          agent = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(agent)

          now = datetime.now(timezone.utc)
          history = {
              "recent@example.ma": {
                  "sent_at": (now - timedelta(minutes=20)).isoformat()
              },
              "old@example.ma": {
                  "sent_at": (now - timedelta(hours=2)).isoformat()
              },
              "missing@example.ma": {"company": "No timestamp"},
          }
          assert agent.count_sends_in_last_hour(history, now=now) == 1

          subject, body = agent.build_message("Exemple SARL", "transport et logistique")
          assert "TRMB SERVICES" in subject
          assert "Exemple SARL" in body
          print("✅ Syntax, rolling hourly limit and email-template checks passed.")
          PY
