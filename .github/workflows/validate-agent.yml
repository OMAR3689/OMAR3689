name: Validate Transport Lead Agent

on:
  push:
    branches: [main]
    paths:
      - 'transport-lead-agent/agent.py'
      - '.github/workflows/transport-leads.yml'
      - '.github/workflows/validate-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile transport-lead-agent/agent.py

      - name: Verify schedule and sending caps
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/transport-leads.yml").read_text(encoding="utf-8")
          assert "actions: write" in workflow, "Expected permission to dispatch the next cycle"
          assert "Schedule next five-minute cycle" in workflow, "Expected automatic self-dispatch step"
          assert "sleep \"$delay\"" in workflow, "Expected a minimum five-minute interval between cycles"
          assert "/actions/workflows/transport-leads.yml/dispatches" in workflow, "Expected workflow_dispatch API call"
          assert "MAX_EMAILS_PER_RUN: '50'" in workflow, "Expected max 50 attempts per run"
          assert "MAX_EMAILS_PER_HOUR: '100'" in workflow, "Expected max 100 emails per rolling hour"
          print("✅ Five-minute self-dispatch loop and email caps validated.")
          PY

      - name: Verify official presentation PDF is downloadable
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen

          url = "https://trmb.ma/assets/documents/presentation-trmb-services.pdf?v=20261018"
          req = Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (compatible; TRMB-Services-PDF-Check/1.0)",
                  "Accept": "application/pdf,*/*;q=0.8",
              },
          )
          with urlopen(req, timeout=25) as response:
              data = response.read(10 * 1024 * 1024 + 1)
              content_type = response.headers.get("Content-Type", "")
              status = response.status
          assert status == 200, f"Unexpected HTTP status: {status}"
          assert len(data) <= 10 * 1024 * 1024, "PDF is larger than the 10 MB limit"
          assert data.startswith(b"%PDF-"), f"Response is not a PDF: {content_type}"
          print(f"✅ Official presentation PDF is reachable ({len(data)} bytes, {content_type}).")
          PY

      - name: Smoke-test safety helpers (no emails sent)
        run: |
          python - <<'PY'
          import importlib.util
          import os
          from datetime import datetime, timedelta, timezone

          spec = importlib.util.spec_from_file_location(
              "transport_agent", "transport-lead-agent/agent.py"
          )
          agent = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(agent)

          now = datetime.now(timezone.utc)
          history = {
              "recent@example.ma": {
                  "sent_at": (now - timedelta(minutes=20)).isoformat()
              },
              "old@example.ma": {
                  "sent_at": (now - timedelta(hours=2)).isoformat()
              },
              "missing@example.ma": {"company": "No timestamp"},
          }
          assert agent.count_sends_in_last_hour(history, now=now) == 1

          original_smtp_port = os.environ.pop("SMTP_PORT", None)
          original_imap_port = os.environ.pop("IMAP_PORT", None)
          try:
              assert agent.configured_port("SMTP_PORT", 465) == 465
              assert agent.configured_port("IMAP_PORT", 993) == 993
              os.environ["SMTP_PORT"] = "not-a-number"
              assert agent.configured_port("SMTP_PORT", 465) == 465
          finally:
              if original_smtp_port is not None:
                  os.environ["SMTP_PORT"] = original_smtp_port
              else:
                  os.environ.pop("SMTP_PORT", None)
              if original_imap_port is not None:
                  os.environ["IMAP_PORT"] = original_imap_port
              else:
                  os.environ.pop("IMAP_PORT", None)

          subject, body = agent.build_message("Exemple SARL", "transport et logistique")
          assert "TRMB SERVICES" in subject
          assert "Exemple SARL" in body

          # Regression checks for noisy directory/tender/competitor results found in prior runs.
          assert agent.is_non_prospect_source(
              "Base de données B2B Maroc", "",
              "https://maroccontact.com/"
          )
          assert agent.is_non_prospect_source(
              "Appels d'offres transport", "",
              "https://datao.ma/"
          )
          assert agent.is_non_prospect_source(
              "Transport de personnel", "",
              "https://msotransports.com/"
          )
          assert agent.is_non_prospect_source(
              "Office National de Sécurité Sanitaire des Produits Alimentaires",
              "",
              "https://onssa.gov.ma/"
          )
          assert agent.is_non_prospect_source(
              "Microsoft Copilot peut-il transcrire des fichiers audio",
              "",
              "https://sonix.ai/ai/fr/microsoft-copilot-peut-il-transcrire-des-fichiers-audio/"
          )
          fallback_names = {item["company"] for item in agent.SEEDED_PUBLIC_CONTACTS}
          assert "Oland Group" in fallback_names
          assert "Remora" in fallback_names
          print("✅ Syntax, config ports, rolling hourly limit, template, prospect filters and fallback contacts passed.")
          PY
