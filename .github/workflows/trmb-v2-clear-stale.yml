name: TRMB V2 maintenance - clear superseded dry run

on:
  push:
    branches: [trmb-agent-v2]
    paths:
      - '.github/workflows/trmb-v2-clear-stale.yml'

permissions:
  actions: write

jobs:
  cancel_superseded_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the superseded preview run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          response=$(curl --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --write-out "\n%{http_code}" \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/runs/39776090416/cancel")
          code=$(printf '%s\n' "$response" | tail -n 1)
          body=$(printf '%s\n' "$response" | sed '$d')
          echo "Cancel API HTTP ${code}"
          if [[ "$code" == "202" || "$code" == "409" || "$code" == "404" ]]; then
            echo "✅ Superseded preview is canceled or no longer cancellable."
            exit 0
          fi
          echo "$body"
          exit 1
